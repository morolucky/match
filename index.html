<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<title>نظام أشجار الشوارع AAA – PBR إجرائي</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#14161a;--pn:#1b1e23;--pn2:#22262c;--ln:#30363e;--tx:#e8e9ea;--mu:#9aa2ab;--ac:#9bcf5c;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);font-family:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;color:var(--tx)}
#app{display:flex;height:100%}
#view{flex:1;position:relative;min-width:0;overflow:hidden}
#view canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 50%,rgba(0,0,0,.5) 100%)}
#hud{position:absolute;top:14px;inset-inline-start:18px;pointer-events:none}
#hud h1{margin:0;font-size:19px;font-weight:600}
#hud p{margin:3px 0 0;font-size:12.5px;color:var(--mu)}
#stat{position:absolute;bottom:12px;inset-inline-start:18px;font:12px/1.6 ui-monospace,monospace;color:var(--mu);pointer-events:none;direction:ltr;text-align:left;white-space:pre}
#ui{width:360px;background:var(--pn);border-inline-start:1px solid var(--ln);overflow-y:auto;padding:14px 16px 28px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
button,select,input[type=number]{font:inherit;font-size:13px;color:var(--tx);background:var(--pn2);border:1px solid var(--ln);border-radius:6px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--ac)}
button.pri{background:var(--ac);color:#15200a;border-color:var(--ac);font-weight:600}
button.on{border-color:var(--ac);color:var(--ac)}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input[type=number]{width:96px;cursor:text}
details{border-top:1px solid var(--ln);padding:10px 0 4px}
summary{cursor:pointer;font-weight:600;margin-bottom:8px}
.ctl{display:grid;grid-template-columns:1fr 58px;align-items:center;gap:2px 8px;margin-bottom:8px;font-size:13px}
.ctl output{text-align:end;color:var(--mu);font-size:12px;direction:ltr}
.ctl input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--ac)}
.chk{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}
.sel{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;font-size:13px}
#msg{font-size:12.5px;color:var(--mu);min-height:18px;margin-top:6px}
#maps{position:absolute;inset-inline:12px;bottom:46px;background:rgba(14,15,18,.94);border:1px solid var(--ln);border-radius:10px;padding:10px;display:none}
#maps.show{display:block}
#maps .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:13px}
#maps .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
#maps figure{margin:0;text-align:center;cursor:pointer}
#maps canvas{width:100%;aspect-ratio:1;background:#000;border:1px solid #2a2f36;border-radius:4px;cursor:pointer}
#maps figcaption{font-size:11.5px;color:var(--mu);margin-top:3px;direction:ltr}
#load{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:var(--bg);z-index:5;font-size:14px;color:var(--mu)}
#load b{color:var(--tx);font-size:16px}
#busy{position:absolute;top:16px;inset-inline-end:16px;font-size:12px;color:var(--ac);opacity:0;transition:opacity .2s;pointer-events:none}
#busy.on{opacity:1}
@media (max-width:760px){#app{flex-direction:column}#ui{width:auto;height:46%;border-inline-start:0;border-top:1px solid var(--ln)}#maps .grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>

 for(const[y,rr]of[[y0+.1,.165],[y0+.5,.212]]){const ring=mesh(new THREE.TorusGeometry(rr,.014,6,6),M.metal);ring.rotation.x=Math.PI/2;ring.position.y=y;g.add(ring)}
 const eave=mesh(new THREE.CylinderGeometry(.27,.24,.04,6),M.metal);eave.position.y=y0+.53;g.add(eave);
 const roof=mesh(new THREE.ConeGeometry(.28,.24,6),M.metal);roof.position.y=y0+.67;g.add(roof);
 const fin=lathe([[0,0],[.035,0],[.04,.03],[.02,.06],[.045,.1],[.03,.14],[0,.22]],16,M.metal);fin.position.y=y0+.77;g.add(fin);
 const fl=new THREE.Mesh(new THREE.SphereGeometry(.05,16,12),M.flame);fl.scale.y=1.5;fl.position.y=y0+.28;g.add(fl);
 lampLight=new THREE.PointLight(0xffa654,0,0,2);lampLight.position.y=y0+.3;lampLight.castShadow=Q.lampShadow;lampLight.shadow.mapSize.set(512,512);lampLight.shadow.bias=-.002;g.add(lampLight);
 root.add(g)}
function buildStakes(root,base){const h=2.1;for(const sd of[-1,1]){const s=mesh(new THREE.CylinderGeometry(.022,.025,h,10),M.stake);s.position.set(sd*.42,base+h/2-.1,0);root.add(s)}
 const bar=mesh(new THREE.CylinderGeometry(.015,.015,.84,8),M.stake);bar.rotation.z=Math.PI/2;bar.position.set(0,base+1.6,0);root.add(bar);
 const tie=mesh(new THREE.TorusGeometry(P.trunkR*.8+.02,.012,6,20),M.tie);tie.rotation.x=Math.PI/2;tie.position.set(0,base+1.6,0);root.add(tie)}

/* =====================================================================
   7. البناء والإضاءة والمعالجة اللاحقة
   ===================================================================== */
let ROOT=null,INFO={},buildMs=0;
function disposeTree(o){o.traverse(c=>{if(c.geometry)c.geometry.dispose();if(c.isInstancedMesh)c.dispose()})}
function build(){const t0=performance.now();
 if(ROOT){disposeTree(ROOT);scene.remove(ROOT)}ROOT=new THREE.Group();scene.add(ROOT);
 const r=rng(P.seed);ph0=r()*10;
 const site=new THREE.Group(),tree=new THREE.Group();ROOT.add(site,tree);
 const base=buildSite(site,rng(P.seed*7+3),INFO);tree.position.y=base;
 INFO=buildTree(tree,r);
 if(P.lamp)buildLamp(ROOT,INFO);else lampLight=null;
 if(P.stakes&&P.trunk)buildStakes(ROOT,base);
 const hP=P.paint==='bands'?[-1,P.paintH*.42,P.paintH*.6,P.paintH]:P.paint==='solid'?[-1,P.paintH,-1,-1]:[-1,-1,-1,-1];
 PU.uPaint.value.set(...hP);PU.uPaintOn.value=P.paint==='none'||!P.trunk?0:1;
 let tris=0;ROOT.traverse(o=>{if(!o.isMesh)return;const g=o.geometry,n=(g.index?g.index.count:g.attributes.position.count)/3;tris+=n*(o.isInstancedMesh?o.count:1)});INFO.tris=tris;
 applyLight();buildMs=performance.now()-t0}
function applyLight(){const L=LIGHTS[P.light];scene.background=new THREE.Color(L.bg);scene.fog=new THREE.FogExp2(L.bg,L.fog);
 hemi.color.set(L.hs);hemi.groundColor.set(L.hg);hemi.intensity=L.hi;scene.environmentIntensity=L.env;R.toneMappingExposure=L.exp*P.exposure;
 const az=P.sunAz*Math.PI/180,el=P.sunEl*Math.PI/180;sunDir.set(Math.cos(el)*Math.sin(az),Math.sin(el),Math.cos(el)*Math.cos(az));
 const tgt=V(0,(INFO.cy||2)*.5,0),Rb=Math.max(P.plaza,P.cw,P.cd)*.75+1.5;sun.target.position.copy(tgt);sun.position.copy(tgt).addScaledVector(sunDir,30);
 Object.assign(sun.shadow.camera,{left:-Rb,right:Rb,top:Rb,bottom:-Rb,near:5,far:60});sun.shadow.camera.updateProjectionMatrix();
 if(sun.shadow.mapSize.x!==Q.shadow){sun.shadow.mapSize.set(Q.shadow,Q.shadow);sun.shadow.map?.dispose();sun.shadow.map=null}
 sun.color.set(L.sun);sun.intensity=L.sunI;
 SU.uSSSCol.value.copy(sun.color).multiplyScalar(L.sunI*L.sss);SU.uSSS.value=P.sss;
 const on=P.lampOn?L.lamp:0;M.glass.emissiveIntensity=2.4*on;M.flame.color.setRGB(5*on+.15,3.2*on+.1,1.4*on+.05);if(lampLight)lampLight.intensity=9*on;
 WU.uWind.value=P.wind;controls.autoRotate=P.turn}
let composer=null,gtao=null,bloom=null;
function setupComposer(){if(composer){composer.renderTarget1.dispose();composer.renderTarget2.dispose();gtao?.dispose?.()}
 const w=view.clientWidth||800,h=view.clientHeight||600,pr=Math.min(devicePixelRatio||1,Q.pr);R.setPixelRatio(pr);R.setSize(w,h,false);
 composer=new EffectComposer(R,new THREE.WebGLRenderTarget(w*pr,h*pr,{type:THREE.HalfFloatType,samples:Q.msaa}));composer.setPixelRatio(pr);composer.setSize(w,h);
 composer.addPass(new RenderPass(scene,cam));gtao=null;
 if(Q.ao){gtao=new GTAOPass(scene,cam,w*pr,h*pr);gtao.blendIntensity=.9;gtao.updateGtaoMaterial({radius:.45,distanceExponent:1.5,thickness:1.2,scale:1,samples:12});gtao.updatePdMaterial({lumaPhi:10,depthPhi:2,normalPhi:3,radius:5,rings:2,samples:16});
  /* GTAO يستعمل مادة واحدة للنواظم تتجاهل الشفافية؛ نبدّلها بمواد تحترم قناع الأوراق والرياح */
  const orig=gtao.renderOverride.bind(gtao);
  gtao.renderOverride=function(rd,om,rt,cc,ca){if(om!==this.normalMaterial)return orig(rd,om,rt,cc,ca);
   const sw=[],au=rd.shadowMap.autoUpdate;scene.traverseVisible(o=>{if(o.isMesh){sw.push([o,o.material]);o.material=o.material.transparent?M.defaultNM:(o.userData.nm||M.defaultNM)}});
   rd.getClearColor(this.originalClearColor);const oa=rd.getClearAlpha(),oac=rd.autoClear;rd.shadowMap.autoUpdate=false;
   rd.setRenderTarget(rt);rd.autoClear=false;rd.setClearColor(cc);rd.setClearAlpha(ca||0);rd.clear();rd.render(this.scene,this.camera);
   sw.forEach(([o,m])=>o.material=m);rd.shadowMap.autoUpdate=au;rd.autoClear=oac;rd.setClearColor(this.originalClearColor);rd.setClearAlpha(oa)};
  composer.addPass(gtao)}
 if(Q.bloom){bloom=new UnrealBloomPass(new THREE.Vector2(w,h),.32,.55,1);composer.addPass(bloom)}
 composer.addPass(new OutputPass());fit()}
function fit(){const w=view.clientWidth,h=view.clientHeight;if(!w||!h)return;R.setSize(w,h,false);composer?.setSize(w,h);cam.aspect=w/h;cam.fov=w/h<.9?42:30;cam.updateProjectionMatrix()}
new ResizeObserver(fit).observe(view);

/* =====================================================================
   8. الواجهة
   ===================================================================== */
const ui=document.getElementById('ui'),stat=document.getElementById('stat'),busy=document.getElementById('busy');
let msgEl;const msg=t=>{if(msgEl)msgEl.textContent=t};
const ctrls={};
function fmt(v,st){return st>=1?String(Math.round(v)):(+v).toFixed(st<.01?3:2)}
function buildUI(){ui.innerHTML='';
 const top=document.createElement('div');top.innerHTML=`<div class="row" id="pre"></div>
 <div class="row"><button class="pri" id="smart">توليد ذكي</button><button id="rnd">بذرة عشوائية</button><label class="sel" style="margin:0;gap:6px">البذرة <input type="number" id="seed" min="0" step="1"></label></div>
 <div class="sel"><span>الجودة</span><select id="qual"><option value="low">منخفضة</option><option value="medium">متوسطة</option><option value="high">عالية</option><option value="ultra">فائقة (Ultra)</option></select></div>
 <div class="row"><button id="mapsBtn">خرائط PBR</button><button id="shot">لقطة PNG</button><button id="glb">تصدير GLB</button><button id="copy">نسخ JSON</button><button id="paste">لصق JSON</button></div><div id="msg"></div>`;
 ui.appendChild(top);msgEl=top.querySelector('#msg');
 PRE.forEach(([n,o])=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>{P={...DEF,...o};syncUI();controls.target.set(0,(P.trunk?P.trunkH+P.ch*.35:P.ch*.5),0);rebuild(true);msg('تم تطبيق: '+n)};top.querySelector('#pre').appendChild(b)});
 for(const[title,items]of SC){const d=document.createElement('details');d.open=title==='التاج'||title==='الأوراق';d.innerHTML=`<summary>${title}</summary>`;
  for(const it of items){const[k,label]=it;let el;
   if(it[2]==='c'){el=document.createElement('label');el.className='chk';el.innerHTML=`<input type="checkbox"> ${label}`;const inp=el.querySelector('input');inp.onchange=()=>set(k,inp.checked);ctrls[k]=()=>inp.checked=P[k]}
   else if(it[2]==='s'){el=document.createElement('label');el.className='sel';el.innerHTML=`<span>${label}</span><select>${it[3].map(([v,t])=>`<option value="${v}">${t}</option>`).join('')}</select>`;const s=el.querySelector('select');s.onchange=()=>set(k,s.value);ctrls[k]=()=>s.value=P[k]}
   else{const[, ,mn,mx,st]=it;el=document.createElement('label');el.className='ctl';el.innerHTML=`<span>${label}</span><output></output><input type="range" min="${mn}" max="${mx}" step="${st}">`;const inp=el.querySelector('input'),out=el.querySelector('output');
    inp.oninput=()=>{out.textContent=fmt(inp.value,st);set(k,+inp.value)};ctrls[k]=()=>{inp.value=P[k];out.textContent=fmt(P[k],st)}}
   d.appendChild(el)}
  ui.appendChild(d)}
 const $=id=>top.querySelector('#'+id);
 $('seed').onchange=e=>set('seed',Math.max(0,parseInt(e.target.value)||0));
 $('rnd').onclick=()=>{P.seed=(Math.random()*1e5)|0;syncUI();rebuild()};
 $('smart').onclick=()=>{const r=rng((Math.random()*1e9)|0),j=(k,a)=>{P[k]=+(P[k]*(1+(r()-.5)*2*a)).toFixed(3)};P.seed=(r()*1e5)|0;j('cw',.15);j('cd',.15);j('ch',.15);j('lean',.4);j('wobble',.4);j('attractors',.2);P.attractors=Math.round(P.attractors);j('leafSize',.12);P.hue=+((r()-.5)*.06).toFixed(3);syncUI();rebuild();msg('توليد ذكي: بذرة '+P.seed)};
 $('qual').onchange=async e=>{QN=e.target.value;Q=QUALITY[QN];busy.classList.add('on');await tick();await makeLeafTextures(false);if(lampLight)lampLight.castShadow=Q.lampShadow;setupComposer();build();busy.classList.remove('on');msg('الجودة: '+e.target.selectedOptions[0].text)};
 $('copy').onclick=async()=>{const s=JSON.stringify(P);try{await navigator.clipboard.writeText(s);msg('تم نسخ الإعدادات')}catch{prompt('انسخ الإعدادات:',s)}};
 $('paste').onclick=()=>{const s=prompt('الصق إعدادات JSON:');if(!s)return;try{P={...DEF,...JSON.parse(s)};syncUI();rebuild(true);msg('تم تحميل الإعدادات')}catch{msg('JSON غير صالح')}};
 $('shot').onclick=()=>{composer.render();R.domElement.toBlob(b=>dl(b,`street-tree-${P.seed}.png`));msg('تم حفظ اللقطة')};
 $('glb').onclick=exportGLB;
 $('mapsBtn').onclick=()=>{document.getElementById('maps').classList.toggle('show');drawMaps()};
 syncUI()}
function syncUI(){for(const k in ctrls)ctrls[k]();const s=ui.querySelector('#seed');if(s)s.value=P.seed;const q=ui.querySelector('#qual');if(q)q.value=QN}
let rbT=0,texT=0;
function set(k,v){P[k]=v;if(k==='light'){const L=LIGHTS[v];}
 if(LIVE.has(k)){applyLight();return}
 if(TEXK.has(k)){clearTimeout(texT);busy.classList.add('on');texT=setTimeout(async()=>{await makeLeafTextures(false);build();busy.classList.remove('on');drawMaps()},180);return}
 rebuild()}
function rebuild(now){clearTimeout(rbT);busy.classList.add('on');rbT=setTimeout(()=>{build();busy.classList.remove('on')},now?0:140)}
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
/* عارض خرائط PBR */
const mapSel=document.getElementById('mapSet');[['leaf','ورقة (أطلس)'],['dry','ورقة جافة'],['bark','لحاء'],['stone','حجر الرصيف'],['asphalt','أسفلت'],['soil','تربة/نشارة'],['metal','معدن العمود']].forEach(([v,t])=>mapSel.add(new Option(t,v)));
mapSel.onchange=drawMaps;document.getElementById('mapClose').onclick=()=>document.getElementById('maps').classList.remove('show');
function onBlack(src,mask){const c=canvasOf(src.width,src.height),g=c.getContext('2d');g.drawImage(src,0,0);if(mask){g.globalCompositeOperation='destination-in';g.drawImage(mask,0,0)}
 const o=canvasOf(src.width,src.height),go=o.getContext('2d');go.fillStyle='#000';go.fillRect(0,0,o.width,o.height);go.drawImage(c,0,0);return o}
function drawMaps(){if(!document.getElementById('maps').classList.contains('show')||!LEAF)return;const k=mapSel.value,grid=document.getElementById('mapGrid');grid.innerHTML='';
 const set=k==='leaf'||k==='dry'?{albedo:onBlack(k==='dry'?LEAF.dry:LEAF.albedo,LEAF.maskC),normal:onBlack(LEAF.normal,LEAF.maskC),rough:onBlack(LEAF.rough,LEAF.maskC),metal:onBlack(LEAF.metal,LEAF.maskC),ao:onBlack(LEAF.ao,LEAF.maskC)}:T[k];
 [['albedo','Albedo (Base Color)'],['normal','Normal'],['rough','Roughness'],['metal','Metallic'],['ao','Ambient Occlusion']].forEach(([m,l])=>{const f=document.createElement('figure'),c=canvasOf(256,256);c.getContext('2d').drawImage(set[m],0,0,256,256);
  f.appendChild(c);f.insertAdjacentHTML('beforeend',`<figcaption>${l}</figcaption>`);f.onclick=()=>set[m].toBlob(b=>dl(b,`${k}_${m}.png`));grid.appendChild(f)})}
/* تصدير GLB — الأوراق تُصدَّر بقناع ألفا (alphaMode MASK) */
function exportGLB(){msg('جاري التصدير…');const rgba=onBlack(LEAF.albedo,null),g=rgba.getContext('2d'),a=g.getImageData(0,0,rgba.width,rgba.height),m=LEAF.maskC.getContext('2d').getImageData(0,0,rgba.width,rgba.height).data;
 for(let i=0;i<m.length;i+=4)a.data[i+3]=m[i];g.putImageData(a,0,0);
 const lm=new THREE.MeshStandardMaterial({map:tx(rgba,true),normalMap:M.leaf.normalMap,roughness:.5,alphaTest:.5,side:THREE.DoubleSide}),sw=[];
 ROOT.traverse(o=>{if(o.userData.leaf){sw.push([o,o.material]);o.material=lm}});
 new GLTFExporter().parse(ROOT,res=>{sw.forEach(([o,mm])=>o.material=mm);dl(new Blob([res],{type:'model/gltf-binary'}),`street-tree-${P.seed}.glb`);msg('تم تصدير GLB')},err=>{sw.forEach(([o,mm])=>o.material=mm);msg('فشل التصدير: '+err.message)},{binary:true})}

/* =====================================================================
   9. الحلقة الرئيسية
   ===================================================================== */
const clock=new THREE.Clock();let fr=0,ft=0,fps=0;
function loop(){requestAnimationFrame(loop);if(contextLost||!composer)return;const dt=Math.min(clock.getDelta(),.1);WU.uTime.value+=dt;controls.update();
 SU.uSunView.value.copy(sunDir).transformDirection(cam.matrixWorldInverse);R.info.reset();composer.render();
 fr++;ft+=dt;if(ft>.5){fps=fr/ft;fr=0;ft=0;stat.textContent=`FPS ${fps.toFixed(0)} · draw ${R.info.render.calls} · tris ${(INFO.tris/1e3).toFixed(0)}k\nleaves ${INFO.leaves} · nodes ${INFO.nodes} · build ${buildMs.toFixed(0)}ms · ${QN}`}}
(async()=>{try{await makeTextures();say('بناء الشجرة…');await tick();buildUI();setupComposer();build();document.getElementById('load').remove();window.__treeReady=true;loop()}
 catch(e){window.__treeErr=1;console.error(e);say('خطأ: '+e.message)}})();
</script>
