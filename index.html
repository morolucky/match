<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>استوديو مباني الجزائر العاصمة · Building Studio + LevelLighting</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/designer.css">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="p">
<header class="top"><h3>🏛️ استوديو مباني الجزائر العاصمة</h3><button id="theme" title="فاتح / داكن">🌓</button></header>
<nav class="tabs" role="tablist">
  <button data-tab="alg" class="on" role="tab">🇩🇿 مصمم الجزائر</button>
  <button data-tab="studio" role="tab">🧱 الاستوديو</button>
  <button data-tab="light" role="tab">💡 الإضاءة</button>
  <button data-tab="export" role="tab">📤 تصدير</button>
</nav>

<!-- Algiers designer: generated from js/algiers/schema.js by js/ui/algiersPanel.js -->
<section class="tab on" data-tab="alg"><div id="alg"></div></section>

<!-- classic smart-building studio -->
<section class="tab" data-tab="studio">
<div class="g" id="pre"></div>
<h4>الأبعاد (حرّر ثم اترك المؤشر)</h4><div id="sl"></div>
<div class="r"><label>السقف</label><select id="roof"><option value="hip">قرميد هرمي (Hip)</option><option value="mansard">مانسارد</option><option value="flat">مسطح</option></select></div>
<div class="r"><label>شرفات</label><input type="checkbox" id="bal" checked></div>
<div class="r"><label>نماذج 3D للنوافذ/الأبواب</label><input type="checkbox" id="mdl" checked></div>
<div class="r"><label>مزاريب وأنابيب تصريف</label><input type="checkbox" id="drn" checked></div>
<div class="r"><label>تفاصيل: كورنيش/مصاريع/عمود إنارة</label><input type="checkbox" id="det" checked></div>
<div class="r"><label>برنامج الواجهة (طابق بطابق)</label><select id="prog"><option value="1" selected>متنوّع: أقواس / شرفة ممتدة / شرفات</option><option value="0">موحّد (كما كان)</option></select></div>
<div class="r"><label>نمط النافذة</label><select id="wst"><option value="0" selected>متنوّع (Mix)</option><option value="1">كلاسيكي</option><option value="2">بجبهة مثلثة</option><option value="3">بقوس مقطعي</option><option value="4">بسيط</option></select></div>
<div class="r"><label>نمط الباب</label><select id="dst"><option value="0" selected>متنوّع (Mix)</option><option value="6">أزرق مقوّس</option><option value="1">أسود كلاسيكي</option><option value="2">أخضر بحديد</option><option value="5">رولّ معدني مقوّس (محل)</option><option value="3">برونزي زجاجي</option><option value="4">خشب الجوز</option></select></div>
<h4>الخامات (Shader)</h4>
<div class="r"><label>جدار خرسانة PBR</label><input type="checkbox" id="fxc" checked></div>
<div class="r"><label>زجاج Shader</label><input type="checkbox" id="fxg" checked></div>
<div class="r"><label>قرميد PBR للسقف</label><input type="checkbox" id="fxr" checked></div>
<div class="r"><label>حجم القرميد</label><input type="range" id="tile" min="0.14" max="0.4" step="0.01" value="0.23"></div>
<div class="r"><label>اتساخ الخرسانة</label><input type="range" id="grime" min="0" max="1" step="0.05" value="0.5"></div>
<div class="r"><label>حجم لوح القالب</label><input type="range" id="panel" min="1.2" max="4" step="0.1" value="2.4"></div>
</section>

<section class="tab" data-tab="light">
<h4>الإضاءة (من ملفاتك)</h4>
<div class="r"><label>الوقت (ساعة)</label><input type="range" id="time" min="0" max="24" step="0.1" value="17"><span id="o_time">17.0</span></div>
<div class="r"><label>تعريض يدوي</label><input type="range" id="ex" min="0.4" max="2" step="0.05" value="1"></div>
<div class="r"><label>Lumina GI</label><input type="checkbox" id="gi" checked></div>
<div class="r"><label>SSR + GTAO</label><input type="checkbox" id="ssr" checked></div>
<div class="r"><label>Auto exposure</label><input type="checkbox" id="ae" checked></div>
<div class="r"><label>مضاد التعرج</label><select id="aa"><option value="taa">TAA</option><option value="smaa">SMAA</option></select></div>
<div class="r"><label>Lumina-Lite</label><input type="checkbox" id="lite" checked></div>
<div class="g"><button id="bm">⏱ مقارنة الأداء (قديم vs Lite)</button></div><div id="perf" style="font-size:11px;opacity:.85;white-space:pre-line"></div>
<div class="r"><label>DLSS scale</label><select id="dl"><option value="auto">Auto (ديناميكي)</option><option value="1" selected>1.0 (أصلي)</option><option value="0.75">0.75</option><option value="0.6">0.6 (أسرع)</option></select></div>
</section>

<section class="tab" data-tab="export">
<h4>خامات من Bake Lab</h4><button id="fiBtn" style="width:100%">📥 تحميل Albedo / Normal / Roughness / AO</button><input type="file" id="fi" accept="image/*" multiple hidden>
<h4>تصدير</h4><div class="g"><button id="e1">UV Layout</button><button id="e2">Guide</button><button id="e3">OBJ+UV</button><button id="shot">لقطة</button></div>
</section>

<div id="st"></div><p style="font-size:11px;opacity:.7">اسم ملف الخامة يجب أن يحتوي albedo أو normal أو rough أو ao. الدوران: سحب · التكبير: عجلة/قرص.</p>
</div>
<div id="v"><div id="err" hidden></div></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
